<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Compromise: Missouri, 1820</title>
<style>
:root{
  --paper:#efe4c8; --card:#f6eed6; --card2:#eadcb8; --ink:#2b1d12; --ink2:#6a5238; --rule:#cdb98e;
  --red:#a4302a; --gold:#b9892a; --green:#3f7a48; --blue:#2e5f9e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#241810;color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0,#3a2a1c 0,#241810 70%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:1480px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}

/* ---- HUD ---- */
#hud{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:7px 12px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud .ttl{font-style:italic;font-size:1.05rem;letter-spacing:.01em;margin-right:auto}
#hud .ttl b{font-style:normal;font-weight:700}
#hud .when{font-size:.98rem}
#hud .when small{color:var(--ink2);margin-left:6px}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);background:var(--card2)}
.pip.on{background:var(--red)}
.favors{display:flex;gap:4px;align-items:center}
.fav{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card2)}
.fav.on{background:var(--gold)}
.fav.spent{background:repeating-linear-gradient(45deg,var(--gold) 0 3px,#8a6418 3px 5px)}
.hudlbl{font-size:.82rem;color:var(--ink2);margin-right:4px}
.hbtn{background:var(--card2);border:2px solid var(--ink);border-radius:5px;padding:4px 10px;font-size:.9rem}
.hbtn:hover{background:#e3d2a6}

main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:8px;align-items:start}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}}

/* ---- stage ---- */
#left{display:flex;flex-direction:column;gap:6px;min-width:0}
#stage{position:relative;aspect-ratio:1200/780;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--paper);container-type:inline-size;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fg{pointer-events:none}
#fg .badge{pointer-events:auto;cursor:pointer}
.spr{transition:transform .9s cubic-bezier(.35,.1,.25,1)}
.spr.instant{transition:none}
.spr.seat .legs,.spr.seat .shadow{display:none}
.spr.seat .body{clip-path:url(#bustClip)}
.lg{transform-box:fill-box;transform-origin:50% 0}
.spr.walk .lgl{animation:step .26s infinite alternate ease-in-out}
.spr.walk .lgr{animation:step .26s infinite alternate-reverse ease-in-out}
.spr.walk .bob{animation:bob .26s infinite alternate ease-in-out}
@keyframes step{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
.badge .ring{fill:var(--card);stroke:var(--ink);stroke-width:3}
.badge.new .ring{stroke:var(--red);stroke-width:4;animation:ringp 1.6s infinite}
.badge.done .ring{stroke:var(--green);stroke-width:4}
.badge:hover .ring,.badge:focus-visible .ring{stroke:var(--gold);stroke-width:5}
.badge text{font-family:var(--serif);font-style:italic;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.badge .tag{font-style:normal;font-size:13px;fill:#fff;stroke:none}
@keyframes ringp{0%,100%{stroke-width:3}50%{stroke-width:7}}
/* ---- tally strip ---- */
#tally{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px}
.rctabs{display:flex;gap:6px;flex-wrap:wrap}
.rctab{background:var(--card2);border:2px solid var(--ink);border-radius:5px;padding:3px 10px;font-size:.93rem}
.rctab.on{background:var(--ink);color:var(--card)}
.tbar{position:relative;height:20px;border:2px solid var(--ink);border-radius:4px;display:flex;overflow:hidden;background:#d9cfb6}
.tbar i{display:block;height:100%;transition:width .8s ease}
.tbar .need{position:absolute;top:-3px;bottom:-3px;width:0;border-left:3px solid var(--ink)}
.tnums{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.95rem}
.tnums span b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.tcaution{font-size:.86rem;color:var(--red);font-style:italic}

/* ---- panel ---- */
#panel{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px;position:relative;min-height:420px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
@media(min-width:1001px){#panel{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}}
.panelh{font-size:1.25rem;font-style:italic;margin-bottom:8px}
.sub{color:var(--ink2);font-size:.92rem}
.btn{background:var(--red);color:#fbf3dd;border:2px solid var(--ink);border-radius:6px;padding:9px 16px;font-size:1.02rem;font-weight:700;box-shadow:0 2px 0 var(--ink)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#b9ad92;color:#6b6250;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.btn.wide{width:100%}

/* talk chips */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 2px 8px;margin:0 -2px}
@media(max-width:1000px){.chips{display:flex;overflow-x:auto;scrollbar-width:thin}}
.chip{flex:0 0 auto;min-width:78px;background:var(--card2);border:2px solid var(--ink);border-radius:7px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.chip:hover{background:#e3d2a6}
.chip svg{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.chip .cn{font-size:.82rem;font-weight:700;line-height:1.1}
.chip .cs{font-size:.72rem;color:var(--ink2);line-height:1.1;min-height:1.6em}
.chip.new{border-color:var(--red);box-shadow:0 0 0 2px rgba(164,48,42,.35)}
.chip.done{border-color:var(--green)}
.chip[disabled]{opacity:.55}

/* bill sheet */
.billsheet{background:#fbf5e2;border:2px solid var(--ink);border-radius:3px;padding:10px 10px 8px;background-image:linear-gradient(transparent 31px,rgba(150,120,70,.12) 32px);background-size:100% 32px;box-shadow:inset 0 0 0 4px #fbf5e2,inset 0 0 0 5px var(--rule)}
.billsheet h3{font-size:1.1rem;font-style:italic;text-align:center;margin:2px 0 6px}
.art{display:grid;grid-template-columns:30px 1fr auto;gap:0 8px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--rule);padding:7px 2px;align-items:center}
.art:first-of-type{border-top:0}
.art:hover{background:rgba(185,137,42,.12)}
.art .rn{grid-row:1/3;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;background:var(--card2)}
.art .at{font-size:.8rem;color:var(--ink2);font-style:italic}
.art .av{font-size:.98rem;line-height:1.2;grid-column:2}
.art .ed{grid-row:1/3;grid-column:3;font-size:.8rem;color:var(--red);font-style:italic}
.art.changed .rn{background:var(--gold)}
.art .newtag{display:inline-block;margin-left:6px;background:var(--gold);color:#fff;border-radius:9px;padding:0 6px;font-size:.7rem;font-style:normal}
.costline{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 2px;font-size:.92rem}
.hint{font-size:.88rem;color:var(--ink2);margin:8px 2px}

/* picker */
.pick{position:absolute;inset:0;background:var(--card);border-radius:4px;padding:12px;overflow:auto;z-index:5;display:flex;flex-direction:column;gap:6px}
@media(max-width:1000px){.pick{position:fixed;inset:auto 0 0 0;max-height:82vh;border-radius:14px 14px 0 0;border:2px solid var(--ink);box-shadow:0 -6px 24px rgba(0,0,0,.5);padding-bottom:20px}}
.pick h3{font-size:1.15rem;font-style:italic}
.pick .grp{font-size:.85rem;color:var(--ink2);font-style:italic;margin-top:6px;border-bottom:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;text-align:left;background:#fbf5e2;border:2px solid var(--rule);border-radius:6px;padding:8px 8px;width:100%;align-items:start}
.opt:hover{border-color:var(--gold)}
.opt .mk{grid-row:1/3;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);margin-top:2px;background:var(--card2)}
.opt.sq .mk{border-radius:4px}
.opt.on{border-color:var(--ink);background:#f3e5b8}
.opt.on .mk{background:var(--red);box-shadow:inset 0 0 0 3px #f3e5b8}
.opt .ol{font-size:1rem;line-height:1.2}
.opt .os{font-size:.85rem;color:var(--ink2);line-height:1.2;grid-column:2}
.opt .oc{grid-row:1/3;grid-column:3;font-size:.8rem;color:#7a5a10;font-weight:700;white-space:nowrap}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt.fresh{border-color:var(--gold)}

/* talk */
.talkview{display:flex;flex-direction:column;gap:8px}
.scene{aspect-ratio:16/9;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:#e9dbb8}
.scene svg{display:block;width:100%;height:100%}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.8s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.m-open{display:none}.mo .m-closed{display:none}.mo .m-open{display:inline}
.nameplate{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.nameplate b{font-size:1.1rem}
.nameplate span{font-size:.88rem;color:var(--ink2);font-style:italic}
.bubble{position:relative;background:#fbf5e2;border:2px solid var(--ink);border-radius:8px;padding:11px 13px;min-height:108px;font-size:1.06rem;line-height:1.38;cursor:pointer}
.bubble::before{content:"";position:absolute;top:-10px;right:52px;width:16px;height:16px;background:#fbf5e2;border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble .cur{display:inline-block;width:.5em}
.talkfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.talkfoot .sk{font-size:.82rem;color:var(--ink2);font-style:italic}
.scalebox{background:#fbf5e2;border:2px solid var(--ink);border-radius:6px;padding:4px 8px}
.scalebox svg{width:100%;max-height:150px;display:block}
.scalebox .cap{font-size:.86rem;color:var(--ink2);font-style:italic;text-align:center}

/* vote */
.voteview{display:flex;flex-direction:column;gap:10px;text-align:center}
.voteview .rcname{font-size:1.35rem;font-style:italic}
.bignum{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bignum .a{color:var(--green)}.bignum .n{color:var(--red)}
.verdict{min-height:1.6em;font-size:1.15rem;font-style:italic}
.verdict.pass{color:var(--green)}.verdict.fail{color:var(--red)}
.needline{font-size:.92rem;color:var(--ink2)}

/* notes */
.notes .cap{margin:10px 0 3px;font-weight:700}
.notes p{font-size:.97rem;line-height:1.35;margin:2px 0}
.notes .q{border-left:3px solid var(--rule);padding-left:8px;margin:4px 0;color:#3d2b1a}
.notes .day{font-size:.8rem;color:var(--ink2);font-style:italic}

/* overlays */
#overlay{position:fixed;inset:0;background:rgba(20,12,6,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#overlay.on{display:flex}
.card{background:var(--card);border:3px solid var(--ink);border-radius:8px;max-width:560px;width:100%;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
.card h2{font-size:1.5rem;font-style:italic;margin-bottom:6px}
.card p{font-size:1.04rem;line-height:1.42;margin:8px 0}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.card ul{margin:6px 0 6px 20px;padding:0}.card li{margin:4px 0;font-size:1rem;line-height:1.3}
.card .small{font-size:.9rem;color:var(--ink2)}
.title h1{font-size:2.2rem;font-style:italic;line-height:1.05}
.title .r1{font-size:1.15rem;color:var(--red);font-style:italic;margin:4px 0 10px}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:#fbf3dd;padding:9px 14px;border-radius:7px;font-size:.98rem;opacity:0;pointer-events:none;transition:.35s;z-index:60;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.epi h2{font-size:1.7rem}
.epi .stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:2px 12px;border-radius:4px;transform:rotate(-2deg);font-weight:700;font-style:italic;margin:4px 0 8px}
.epi .stamp.lost{border-color:#6a5238;color:#6a5238}
.epi .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.epi .box{background:#fbf5e2;border:2px solid var(--rule);border-radius:6px;padding:8px 10px}
.epi .box b{display:block;margin-bottom:2px}
@media(max-width:560px){.epi .grid2{grid-template-columns:1fr}.title h1{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){.spr{transition-duration:.01s!important}.badge.new .ring{animation:none}.lid{animation:none}}

#hud .meters{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
#hud .hbtns{display:flex;gap:8px;order:3}
#hud .when{order:1}
#hud .meters{order:2}
#zoomBtn{position:absolute;right:8px;top:8px;z-index:3;display:none;background:var(--card);border:2px solid var(--ink);border-radius:5px;padding:3px 9px;font-size:.85rem}
#stageWrap{position:relative}
@media(max-width:700px){
  #toast{bottom:auto;top:10px;transform:translate(-50%,-20px)}
  #toast.on{transform:translate(-50%,0)}
  #app{padding:6px;gap:6px}
  #hud{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 9px}
  #hud .ttl{font-size:.92rem;margin:0}
  #hud .ttl i{display:none}
  #hud .hbtns,#hud .when,#hud .meters{order:0}
  #hud .hbtns{justify-content:flex-end}
  .hbtn{padding:3px 8px;font-size:.8rem}
  #hud .when{font-size:.85rem}
  #hud .when small{display:block;margin:0;font-size:.72rem}
  #hud .meters{justify-content:flex-end;gap:2px 10px}
  .hudlbl{display:none}
  #panel{padding:10px}
  .bubble{font-size:1rem}
  #zoomBtn{display:block}
  #stageWrap.zoom{overflow-x:auto;border-radius:6px;-webkit-overflow-scrolling:touch}
  #stageWrap.zoom #stage{width:920px;max-width:none}
  #tally{padding:7px 9px}
  .tnums{font-size:.88rem;gap:2px 12px}
}

.gloss{margin-top:12px;background:#fbf5e2;border:2px solid var(--rule);border-radius:6px;padding:6px 10px}
.gloss summary{cursor:pointer;font-weight:700;padding:4px 0}
.gloss dl{margin:6px 0 2px}.gloss dt{font-weight:700;margin-top:8px}.gloss dd{margin:1px 0 0;font-size:.95rem;line-height:1.35;color:#3d2b1a}

.mapbox svg,.scalebox.mapbox svg{width:100%;height:auto;max-height:none;display:block;border:2px solid var(--ink);border-radius:4px}
.scalebox.mapbox{padding:4px}
.mapcap{font-size:.98rem;line-height:1.3;margin:6px 2px 4px;font-weight:700;color:#3d2b1a}
.explain{background:#fbf5e2;border:2px solid var(--rule);border-radius:6px;padding:7px 10px;margin:4px 0 6px}
.explain b{display:block;margin-bottom:2px}.explain p{margin:0;font-size:.93rem;line-height:1.38}
.mapSvg{display:block}

/* ---- story sequences ---- */
#cinema{position:fixed; inset:0; width:100%; height:100%; border:0; z-index:300; display:none; background:#0d0805}
#cinema.on{display:block}
body.cin{overflow:hidden}
/* ---- debrief page ---- */
#debrief{position:fixed; inset:0; z-index:150; overflow:auto; background:var(--paper); color:var(--ink); padding:14px}
.dpage{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.dhead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; border-bottom:3px double var(--ink); padding-bottom:8px}
.dhead h1{font-size:2rem; font-style:italic; line-height:1.05}
.dsub{color:var(--ink2); font-size:1rem; margin-top:2px}
.dname{display:flex; gap:8px; align-items:center; font-weight:700}
.dname input{font:inherit; padding:6px 8px; border:2px solid var(--ink); border-radius:4px; background:#fbf5e2; min-width:220px}
.dgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:700px){.dgrid{grid-template-columns:1fr}.dhead h1{font-size:1.6rem}.dname input{min-width:0;width:100%}.dname{width:100%}}
.dbox{background:#fbf5e2; border:2px solid var(--ink); border-radius:6px; padding:10px 12px}
.dbox h2{font-size:1.15rem; font-style:italic; margin-bottom:6px}
.dbox ul{margin:4px 0 4px 18px; padding:0}.dbox li{margin:4px 0; line-height:1.35}
.dbox p{margin:6px 0; line-height:1.4}
.dt{width:100%; border-collapse:collapse; font-size:.98rem}
.dt td,.dt th{border-bottom:1px solid var(--rule); padding:5px 6px; text-align:left; vertical-align:top}
.dt th{font-style:italic; border-bottom:2px solid var(--ink)}
.dq{margin:4px 0 0 20px; padding:0}.dq li{margin:0 0 12px}.dq .hint{color:var(--ink2); font-size:.92rem; font-style:italic; margin:2px 0 4px}
.dq textarea{width:100%; font:inherit; padding:8px; border:2px solid var(--ink); border-radius:4px; background:#fff; resize:vertical; min-height:84px}
.dbtns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:6px 0 18px}
@media print{
  @page{margin:12mm}
  html,body{background:#fff !important}
  body > *:not(#debrief){display:none !important}
  #debrief{position:static !important; inset:auto !important; overflow:visible !important; background:#fff !important; padding:0 !important; color:#000}
  .dbtns{display:none !important}
  .dbox{background:#fff !important; border:1.5px solid #000; break-inside:avoid}
  .dq textarea{border:1px solid #000; min-height:90px; resize:none}
  .dname input{border:0; border-bottom:1.5px solid #000; border-radius:0; background:#fff}
}

#debrief h1:focus,#debrief h1:focus-visible{outline:none}

</style>
</head>
<body>
<div id="app"></div>
<script>

0\" text-anchor=\"middle\" font-family='\"IM Fell English\",\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif' font-size=\"14\" font-weight=\"700\" fill=\"#2b1d12\">N<\/text><\/g>\n  <\/svg>\n      <p class=\"s1\"><b>1820.<\/b> Slavery is banned north of 36\u00b030\u2032, except in Missouri.<\/p>\n      <p class=\"s2\"><b>1854.<\/b> The Kansas\u2013Nebraska Act cancels the line.<\/p>\n      <p class=\"s3\"><b>1857.<\/b> The Supreme Court says the line was never legal. Dred Scott had lived at Fort Snelling, north of the line.<\/p>\n    <\/div>\n    <div class=\"titlecard\" id=\"titlecard\">\n      <p class=\"kick\">The House, February 1819<\/p>\n      <div class=\"roll\" aria-hidden=\"true\"><span><b id=\"tAye\">0<\/b><i>aye<\/i><\/span><span class=\"dash\">to<\/span><span><b id=\"tNay\">0<\/b><i>nay<\/i><\/span><\/div>\n      <p class=\"sub2\" role=\"status\">Tallmadge\u2019s amendment passes 87 to 76. Almost every Northern member votes yes. Almost every Southern member votes no.<\/p>\n    <\/div>\n    <div class=\"order\" id=\"order\">The House will come to order.<\/div>\n\n    <div class=\"start\" id=\"start\">\n      <h1 id=\"stH\">The Great Compromise<\/h1>\n      <p class=\"sub\" id=\"stSub\">Prologue: the road to 1820<\/p>\n      <div class=\"btns\">\n        <button class=\"big\" id=\"go\">Begin<\/button>\n        <button class=\"big alt\" id=\"goSound\">Begin with sound<\/button>\n      <\/div>\n      <p class=\"fine\" id=\"stFine\">The story starts with a two-and-a-half-minute prologue. Tap the picture to move ahead.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"bar\">\n    <div class=\"ticks\" id=\"ticks\" aria-hidden=\"true\"><\/div>\n    <div class=\"ctl\">\n      <button class=\"btn\" id=\"bBack\">Back<\/button>\n      <button class=\"btn\" id=\"bPause\">Pause<\/button>\n      <button class=\"btn\" id=\"bNext\">Next<\/button>\n      <button class=\"btn\" id=\"bSound\" aria-pressed=\"false\">Sound off<\/button>\n      <button class=\"btn\" id=\"bSkip\">Skip to the gavel<\/button>\n    <\/div>\n  <\/div>\n\n  <section class=\"cap\" aria-live=\"polite\">\n    <p class=\"dateline\"><span class=\"yr\" id=\"yr\"><\/span><span id=\"place\"><\/span><\/p>\n    <div id=\"lines\"><\/div>\n    <div class=\"endrow\" id=\"endrow\">\n      <button class=\"big\" id=\"bGavel\">Take the gavel<\/button>\n      <button class=\"btn\" id=\"bReplay\">Watch again<\/button>\n      <span class=\"note\" id=\"phaseNote\"><\/span>\n    <\/div>\n  <\/section>\n\n<\/div>\n\n<script>\n/* =====================================================================\n   SOUND (synthesized, optional)\n   ===================================================================== */\nlet actx = null, soundOn = false, amb = null;\nfunction initAudio(){\n  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }\n  if(actx.state === 'suspended') actx.resume();\n  if(!amb) startAmb();\n}\nfunction startAmb(){\n  const n = actx.sampleRate*2, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);\n  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;\n  const src = actx.createBufferSource(); src.buffer = b; src.loop = true;\n  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = .7; f.frequency.value = 500;\n  const g = actx.createGain(); g.gain.value = 0;\n  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();\n  amb = {f, g};\n}\nfunction setAmb(freq, gain){\n  if(!amb) return;\n  amb.f.frequency.setTargetAtTime(freq, actx.currentTime, .6);\n  amb.g.gain.setTargetAtTime(soundOn ? gain : 0, actx.currentTime, .6);\n}\nfunction tone(freq, dur, type='sine', vol=.1, glide=null){\n  if(!soundOn || !actx) return;\n  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();\n  o.type = type; o.frequency.setValueAtTime(freq, t);\n  if(glide) o.frequency.exponentialRampToValueAtTime(glide, t+dur*.5);\n  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);\n  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);\n}\nfunction sceneChime(i){ const base = [196,220,246,262,294,330][i%6]; tone(base,2.2,'sine',.07); setTimeout(()=>tone(base*1.5,2.4,'sine',.04),260); }\nfunction gavelSound(){\n  tone(140,.25,'triangle',.8,30); setTimeout(()=>tone(65,.2,'sine',.3),45);\n  setTimeout(()=>tone(140,.25,'triangle',.8,30),380);\n  setTimeout(()=>tone(140,.3,'triangle',.9,28),760);\n}\n\n/* =====================================================================\n   DRAWING KIT\n   ===================================================================== */\nconst INK = '#26160b';\nconst st = (w=1.6)=>`stroke=\"${INK}\" stroke-width=\"${w}\" stroke-linejoin=\"round\" stroke-linecap=\"round\"`;\nconst rng = s => () => ((s = s*16807 % 2147483647) / 2147483647);\n\n// timed wrappers, driven by scene progress t in [0,1]\nconst FI = (a,b,s)=>`<g data-fi=\"${a},${b}\">${s}<\/g>`;\nconst FO = (a,b,s)=>`<g data-fo=\"${a},${b}\">${s}<\/g>`;\nconst MV = (x0,y0,x1,y1,a,b,s)=>`<g data-mv=\"${x0},${y0},${x1},${y1},${a},${b}\">${s}<\/g>`;\nconst GR = (ox,oy,a,b,s)=>`<g data-sc=\"${ox},${oy},${a},${b}\">${s}<\/g>`;\n\nconst SKY = `<rect x=\"-1200\" y=\"-800\" width=\"4600\" height=\"2400\" fill=\"url(#skyg)\"/>`;\n\nfunction ridge(seed,y,amp,fill,o={}){\n  const {x0=-400, x1=2800, step=80, line=true} = o, r = rng(seed*97+13), p = [];\n  for(let x=x0;x<=x1;x+=step) p.push([x, y+(r()-.5)*amp]);\n  let d = `M${x0},1000 L${p[0][0]},${p[0][1]}`;\n  for(let i=0;i<p.length-1;i++){ const [a,b]=p[i], [c,e]=p[i+1]; d += ` Q${a},${b} ${(a+c)/2},${(b+e)/2}`; }\n  d += ` L${x1},1000 Z`;\n  return `<path d=\"${d}\" fill=\"${fill}\" ${line?st(1.3):''}/>`;\n}\nconst cloud = (x,y,s=1,o=.8)=>`<g transform=\"translate(${x},${y}) scale(${s})\" opacity=\"${o}\" fill=\"#fff\"><ellipse rx=\"70\" ry=\"18\"/><ellipse cx=\"-30\" cy=\"-12\" rx=\"36\" ry=\"16\"/><ellipse cx=\"22\" cy=\"-16\" rx=\"42\" ry=\"18\"/><\/g>`;\nconst smoke = (x,y,c='#f4ebd9')=>`<circle class=\"puff\" cx=\"${x}\" cy=\"${y}\" r=\"5\" fill=\"${c}\"/><circle class=\"puff p2\" cx=\"${x}\" cy=\"${y}\" r=\"6\" fill=\"${c}\"/>`;\n\nconst pine = (x,y,s=1,c='#2d4a36')=>`<g transform=\"translate(${x},${y}) scale(${s})\"><g class=\"sway\"><rect x=\"-3\" y=\"-10\" width=\"6\" height=\"12\" fill=\"#4a3220\"/><polygon points=\"0,-78 -20,-34 20,-34\" fill=\"${c}\" ${st(1.2)}/><polygon points=\"0,-58 -25,-14 25,-14\" fill=\"${c}\" ${st(1.2)}/><polygon points=\"0,-38 -30,4 30,4\" fill=\"${c}\" ${st(1.2)}/><\/g><\/g>`;\nconst oak = (x,y,s=1,c='#4f6b34')=>`<g transform=\"translate(${x},${y}) scale(${s})\"><g class=\"sway\"><path d=\"M-6,0 L-4,-40 L4,-40 L6,0Z\" fill=\"#4a3220\" ${st(1.2)}/><circle cx=\"-22\" cy=\"-52\" r=\"24\" fill=\"${c}\" ${st(1.2)}/><circle cx=\"20\" cy=\"-56\" r=\"26\" fill=\"${c}\" ${st(1.2)}/><circle cx=\"0\" cy=\"-74\" r=\"26\" fill=\"${c}\" ${st(1.2)}/><\/g><\/g>`;\n\nconst person = (x,y,s=1,col='#2a1a10',cls='',d=0,hat=false)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><g class=\"${cls}\" style=\"animation-delay:${d}s\"><circle cy=\"-36\" r=\"6.5\" fill=\"${col}\"/>${hat?`<rect x=\"-9\" y=\"-42\" width=\"18\" height=\"3\" fill=\"${col}\"/><rect x=\"-5\" y=\"-50\" width=\"10\" height=\"9\" fill=\"${col}\"/>`:''}<path d=\"M-8,-29 Q0,-33 8,-29 L10,-9 L5,-9 L4,0 L-4,0 L-5,-9 L-10,-9 Z\" fill=\"${col}\"/><\/g><\/g>`;\n\nfunction horse(col='#3a2416', gait=1){\n  const leg = (x,ph,fr)=>`<g transform=\"translate(${x},-34)\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" values=\"${fr};${-fr};${fr}\" dur=\"${(.8/gait).toFixed(2)}s\" begin=\"${ph}s\" repeatCount=\"indefinite\"/><path d=\"M-2.6,0 L2.6,0 L2,38 L-2,38Z\" fill=\"${col}\"/><\/g><\/g>`;\n  return `<g fill=\"${col}\">${leg(-24,0,22)}${leg(-14,.4,-22)}${leg(20,.4,22)}${leg(28,0,-22)}<ellipse cx=\"0\" cy=\"-44\" rx=\"34\" ry=\"15\"/><path d=\"M22,-52 L44,-84 L56,-80 L38,-40Z\"/><ellipse cx=\"60\" cy=\"-76\" rx=\"13\" ry=\"6\" transform=\"rotate(32 60 -76)\"/><path d=\"M46,-86 L50,-96 L54,-84Z\"/><path d=\"M-32,-52 Q-58,-46 -52,-20 Q-46,-40 -30,-40Z\"/><\/g>`;\n}\nfunction rider(x,y,s=1,hc='#3a2416',rc='#1c120a',gait=1){\n  return `<g transform=\"translate(${x},${y}) scale(${s})\"><g class=\"ride\">${horse(hc,gait)}<g fill=\"${rc}\"><path d=\"M-8,-58 L8,-58 L10,-90 L-6,-90Z\"/><circle cx=\"2\" cy=\"-98\" r=\"6.5\"/><rect x=\"-6\" y=\"-104\" width=\"16\" height=\"3\"/><rect x=\"-2\" y=\"-112\" width=\"8\" height=\"9\"/><path d=\"M8,-84 L28,-70\" stroke=\"${rc}\" stroke-width=\"5\" stroke-linecap=\"round\"/><\/g><\/g><\/g>`;\n}\nfunction wagon(s=1, mule=true){\n  const wheel = x=>`<g transform=\"translate(${x},-6)\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0\" to=\"360\" dur=\"2.4s\" repeatCount=\"indefinite\"/><circle r=\"11\" fill=\"#e9c979\" ${st(1.6)}/><path d=\"M-11,0H11M0,-11V11\" ${st(1.2)}/><\/g><\/g>`;\n  return `<g transform=\"scale(${s})\"><path d=\"M-36,-30 Q-38,-68 0,-68 Q38,-68 36,-30Z\" fill=\"#f4ebd9\" ${st()}/><rect x=\"-42\" y=\"-30\" width=\"84\" height=\"12\" fill=\"#243545\" ${st()}/>${wheel(-24)}${wheel(24)}${mule?`<g transform=\"translate(110,0) scale(.62)\">${horse('#4a3220',1)}<\/g>`:''}<\/g>`;\n}\nconst cabin = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-22\" y=\"-24\" width=\"44\" height=\"24\" fill=\"#8a5a33\" ${st()}/><path d=\"M-22,-16H22M-22,-8H22\" stroke=\"${INK}\" stroke-width=\"1\"/><polygon points=\"-27,-24 0,-42 27,-24\" fill=\"#4d301b\" ${st()}/><rect x=\"10\" y=\"-46\" width=\"6\" height=\"14\" fill=\"#6b4a33\" ${st(1)}/><rect x=\"-4\" y=\"-14\" width=\"8\" height=\"14\" fill=\"${INK}\"/>${smoke(13,-50)}<\/g>`;\nconst farmhouse = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-26\" y=\"-28\" width=\"52\" height=\"28\" fill=\"#f4ebd9\" ${st()}/><polygon points=\"-31,-28 0,-50 31,-28\" fill=\"#8c2f23\" ${st()}/><rect x=\"-5\" y=\"-16\" width=\"10\" height=\"16\" fill=\"${INK}\"/><rect x=\"-20\" y=\"-22\" width=\"8\" height=\"9\" fill=\"#ffd77a\" ${st(1)}/><rect x=\"12\" y=\"-22\" width=\"8\" height=\"9\" fill=\"#ffd77a\" ${st(1)}/><rect x=\"16\" y=\"-56\" width=\"7\" height=\"14\" fill=\"#6b4a33\" ${st(1)}/>${smoke(19,-60)}<\/g>`;\nconst church = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-18\" y=\"-28\" width=\"36\" height=\"28\" fill=\"#f4ebd9\" ${st()}/><polygon points=\"-22,-28 0,-42 22,-28\" fill=\"#6b4a33\" ${st()}/><rect x=\"-7\" y=\"-64\" width=\"14\" height=\"26\" fill=\"#f4ebd9\" ${st()}/><polygon points=\"-9,-64 0,-88 9,-64\" fill=\"#6b4a33\" ${st()}/><rect x=\"-4\" y=\"-14\" width=\"8\" height=\"14\" fill=\"${INK}\"/><\/g>`;\nconst plantation = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-52\" y=\"-46\" width=\"104\" height=\"46\" fill=\"#f4ebd9\" ${st()}/><polygon points=\"-58,-46 0,-72 58,-46\" fill=\"#8c2f23\" ${st()}/>${[-42,-24,24,42].map(c=>`<rect x=\"${c-3.5}\" y=\"-46\" width=\"7\" height=\"46\" fill=\"#fff\" ${st(1.2)}/>`).join('')}<rect x=\"-7\" y=\"-18\" width=\"14\" height=\"18\" fill=\"${INK}\"/><\/g>`;\nconst lodge = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><path d=\"M-22,0 Q-22,-30 0,-30 Q22,-30 22,0Z\" fill=\"#b58a5a\" ${st()}/><path d=\"M-5,0 V-12 H5 V0\" fill=\"${INK}\"/><path d=\"M-15,-14 Q0,-22 15,-14\" fill=\"none\" stroke=\"${INK}\" stroke-width=\"1\"/>${smoke(0,-34)}<\/g>`;\nconst bale = (x,y)=>`<g transform=\"translate(${x},${y})\"><rect x=\"-14\" y=\"-18\" width=\"28\" height=\"18\" rx=\"4\" fill=\"#fbf7ec\" ${st()}/><path d=\"M-6,-18V0M6,-18V0\" stroke=\"${INK}\" stroke-width=\"1\"/><\/g>`;\nconst crate = (x,y,s=1)=>`<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-12\" y=\"-20\" width=\"24\" height=\"20\" fill=\"#a67c4a\" ${st(1.2)}/><path d=\"M-12,-10H12M-4,-20V0\" stroke=\"${INK}\" stroke-width=\"1\"/><\/g>`;\n\nfunction ship(x,y,s=1,dir=1){\n  let sails = '';\n  [[-32,120],[8,140],[44,104]].forEach(([mx,h])=>{\n    sails += `<line x1=\"${mx}\" y1=\"0\" x2=\"${mx}\" y2=\"${-h}\" ${st(2.4)}/>`;\n    [8,64].forEach(o=>{ sails += `<path d=\"M${mx-20},${-h+o} L${mx+20},${-h+o} L${mx+18},${-h+o+40} Q${mx},${-h+o+50} ${mx-18},${-h+o+40}Z\" fill=\"#f4ebd9\" ${st(1.3)}/>`; });\n  });\n  return `<g transform=\"translate(${x},${y}) scale(${s*dir},${s})\"><g><animateTransform attributeName=\"transform\" type=\"translate\" values=\"0,0;0,-4;0,0\" dur=\"3.4s\" repeatCount=\"indefinite\"/><path d=\"M-72,0 L72,0 L54,20 L-54,20Z\" fill=\"#4d301b\" ${st()}/>${sails}<\/g><\/g>`;\n}\nfunction steamboat(){\n  return `<g><path d=\"M-44,-6 L44,-6 L34,12 L-34,12Z\" fill=\"#f4ebd9\" ${st()}/><rect x=\"-28\" y=\"-26\" width=\"44\" height=\"20\" fill=\"#8c2f23\" ${st()}/><rect x=\"-22\" y=\"-20\" width=\"8\" height=\"8\" fill=\"#ffd77a\"/><rect x=\"-8\" y=\"-20\" width=\"8\" height=\"8\" fill=\"#ffd77a\"/><rect x=\"18\" y=\"-56\" width=\"9\" height=\"32\" fill=\"${INK}\"/><circle class=\"puff\" cx=\"22\" cy=\"-60\" r=\"7\" fill=\"#3a3a3a\"/><circle class=\"puff p2\" cx=\"22\" cy=\"-60\" r=\"8\" fill=\"#3a3a3a\"/><g transform=\"translate(-46,0)\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0\" to=\"-360\" dur=\"1.6s\" repeatCount=\"indefinite\"/><circle r=\"14\" fill=\"#c99738\" ${st()}/><path d=\"M-14,0H14M0,-14V14M-10,-10L10,10M-10,10L10,-10\" ${st(1.4)}/><\/g><\/g><\/g>`;\n}\nfunction mill(x,y,s,lit){\n  let w='', lw='';\n  for(let r=0;r<3;r++) for(let c=0;c<5;c++){\n    w  += `<rect x=\"${-40+c*17}\" y=\"${-68+r*20}\" width=\"10\" height=\"13\" fill=\"#5b4632\" ${st(1)}/>`;\n    lw += `<rect x=\"${-40+c*17}\" y=\"${-68+r*20}\" width=\"10\" height=\"13\" fill=\"#ffd77a\"/>`;\n  }\n  return `<g transform=\"translate(${x},${y}) scale(${s})\"><rect x=\"-48\" y=\"-80\" width=\"96\" height=\"80\" fill=\"#9c3426\" ${st()}/><polygon points=\"-54,-80 0,-108 54,-80\" fill=\"#4d1b15\" ${st()}/>${w}${FI(lit,lit+.14,lw+`<circle cx=\"0\" cy=\"-40\" r=\"90\" fill=\"url(#glow)\" opacity=\".35\"/>`)}<rect x=\"30\" y=\"-140\" width=\"14\" height=\"62\" fill=\"#5c2017\" ${st()}/>${smoke(37,-144,'#d9d0c0')}<g transform=\"translate(64,-24)\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0\" to=\"360\" dur=\"6s\" repeatCount=\"indefinite\"/><circle r=\"22\" fill=\"none\" stroke=\"${INK}\" stroke-width=\"4\"/><path d=\"M-22,0H22M0,-22V22M-16,-16L16,16M-16,16L16,-16\" ${st(2.4)}/><\/g><\/g><\/g>`;\n}\n// short wavy lines that tile every 64px, so translateX(-64) loops seamlessly\nfunction waves(x0,x1,y0,y1,fill,line='#dbe9ef',seed=3,dens=1){\n  const r = rng(seed*31+7); let s = `<rect x=\"${x0}\" y=\"${y0}\" width=\"${x1-x0}\" height=\"${y1-y0}\" fill=\"${fill}\"/>`;\n  let lines = '';\n  for(let y=y0+12; y<y1; y+=Math.max(9, 26/dens)){\n    const off = Math.floor(r()*64);\n    for(let x=x0-128+off; x<x1+128; x+=64) lines += `<path d=\"M${x},${y} q8,-5 16,0 t16,0\" fill=\"none\" stroke=\"${line}\" stroke-width=\"1.6\" opacity=\".7\"/>`;\n  }\n  return s + `<g class=\"drift\">${lines}<\/g>`;\n}\nfunction grass(seed,y,c='#20321f',x0=-200,x1=2700){\n  const r = rng(seed); let d = '';\n  for(let x=x0;x<x1;x+=26){ const h = 18+r()*34, l = (r()-.5)*14; d += `M${x},${y+30} Q${x+3+l},${y+30-h*.6} ${x+6+l*1.6},${y+30-h} Q${x+9},${y+30-h*.5} ${x+14},${y+30}Z `; }\n  return `<path d=\"${d}\" fill=\"${c}\"/><rect x=\"${x0}\" y=\"${y+28}\" width=\"${x1-x0}\" height=\"200\" fill=\"${c}\"/>`;\n}\n\n// hall (House chamber)\nfunction member(x,y,s,col,hair){\n  return `<g transform=\"translate(${x},${y}) scale(${s})\"><path d=\"M-16,4 Q-16,-20 0,-22 Q16,-20 16,4Z\" fill=\"${col}\" ${st(1)}/><circle cy=\"-31\" r=\"8.5\" fill=\"#e6c4a4\" ${st(1)}/><path d=\"M-8.6,-33 Q0,-45 8.6,-33 Q0,-38 -8.6,-33Z\" fill=\"${hair}\"/><\/g>`;\n}\nfunction arms(x,y,s,col,ph){\n  const a = (dx,sg)=>`<g transform=\"translate(${x+dx*s},${y-18*s}) scale(${s})\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" values=\"${sg*8};${sg*36};${sg*8}\" dur=\"${(.55+ph*.3).toFixed(2)}s\" begin=\"${ph}s\" repeatCount=\"indefinite\"/><rect x=\"-2.6\" y=\"-26\" width=\"5.2\" height=\"28\" rx=\"2.6\" fill=\"${col}\"/><circle cy=\"-29\" r=\"3.6\" fill=\"#e6c4a4\"/><\/g><\/g>`;\n  return a(-13,-1)+a(13,1);\n}\nfunction hallRows(o){\n  const r = rng(o.seed), cols = ['#1f2a36','#3a2a24','#2a3a2e','#2b2b3a','#4a3428'], hairs = ['#2a1a10','#6b5a48','#c9c2b4','#3a2a1c'];\n  let s = '';\n  for(let row=0; row<o.rows; row++){\n    const y = o.y0 + row*o.dy, sc = o.s0 + row*o.ds, n = o.n0 + row*2;\n    let bodies = '', ar = '';\n    for(let i=0;i<n;i++){\n      const x = o.x0 + (o.x1-o.x0)*(i+.5)/n + (r()-.5)*10, col = cols[Math.floor(r()*cols.length)], hair = hairs[Math.floor(r()*hairs.length)];\n      const up = r() < o.stand;\n      bodies += member(x, y - (up?10*sc:0), sc*(up?1.08:1), col, hair);\n      if(up && r() < o.armsP) ar += arms(x, y-10*sc, sc, col, r()*.6);\n    }\n    s += bodies + (ar ? FI(o.armsAt[0], o.armsAt[1], ar) : '');\n    s += `<rect x=\"${o.x0-30}\" y=\"${y+2}\" width=\"${o.x1-o.x0+60}\" height=\"${30*sc}\" fill=\"#5a3a20\" ${st(1.4)}/><path d=\"M${o.x0-30},${y+5}H${o.x1+30}\" stroke=\"#8a6238\" stroke-width=\"2\"/>`;\n  }\n  return s;\n}\nfunction hallBack(o={}){\n  const {wall='#7a5a3c', col='#d9cdb2', drape='#8c2f23', win='#f5e2b0', beams=true} = o;\n  let s = `<rect x=\"-400\" y=\"-100\" width=\"3400\" height=\"560\" fill=\"${wall}\"/>`;\n  for(let i=0;i<10;i++){\n    const x = 60+i*260;\n    s += `<path d=\"M${x-50},380 V150 Q${x-50},80 ${x},80 Q${x+50},80 ${x+50},150 V380Z\" fill=\"${win}\" ${st(2)}/><path d=\"M${x},80V380M${x-50},220H${x+50}\" stroke=\"${INK}\" stroke-width=\"2\"/>`;\n    if(beams && i%2===0) s += `<polygon points=\"${x-40},140 ${x+40},140 ${x+240},600 ${x+30},600\" fill=\"url(#beam)\"/>`;\n    s += `<rect x=\"${x+105}\" y=\"30\" width=\"46\" height=\"400\" fill=\"${col}\" ${st(1.6)}/><path d=\"M${x+116},30V430M${x+128},30V430M${x+140},30V430\" stroke=\"#b7a98a\" stroke-width=\"1.5\"/>< /* ---------------- math helpers ---------------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

      members.push({id:id++, bloc:b, idx:i, z: i === 0 ? 0 : gauss(rng), captain: i === 0});
    }
  }
  return members;
}

/* mods: state-of-the-world adjustments from events and failed votes

const newMods = () => ({extra:{}, riderMult:{}, hard:{}});
const getExtra = (mods, b, k) => ((mods.extra[b] || {})[k] || 0);

function riderSum(b, bill, mods){
  const i = BLOC_IDS.indexOf(b);
  let sw = bill.sw.slice(), penalty = 0;
  if(sw.includes("tariff_up") && sw.includes("tariff_down")){
    sw = sw.filter(x => x !== "tariff_up" && x !== "tariff_down"); penalty = -0.5;
  }
  let s = 0; for(const id of sw) s += SW_FX[id][i];
  s *= (mods.riderMult[b] || 1);
  return s + penalty;
}
function coverMO(b, bill, divided){
  if(b === "C"){
    let c = COVER_LINE_C[bill.ln];
    if(divided) c += 0.4;
    if(bill.me === "joined") c -= 0.8; else if(bill.me === "twin") c += 0.2;
    if(bill.pr === "late") c -= 0.8;
    return c;
  }
  return (SPILL[b] && SPILL[b][bill.ln]) || 0;
}
function compScore(b, comp, bill, mods, divided){
  const hard = (mods.hard[b] || 0);
  switch(comp){
    case "MO":
      return U_MO[b][bill.mo] + coverMO(b, bill, divided) + riderSum(b, bill, mods) * 0.85 + getExtra(mods, b, "MO") + hard;
    case "MEMO":
      return U_MO[b][bill.mo] + coverMO(b, bill, divided) + TIE_JOINED[b] + riderSum(b, bill, mods) * 0.85 + getExtra(mods, b, "MO") + hard;
    case "LINE":
      return U_LN[b][bill.ln] + riderSum(b, bill, mods) * 0.6 + getExtra(mods, b, "LINE");
    case "ME":
      return U_ME[b] + ((ME_PAIR[bill.me] || {})[b] || 0) + riderSum(b, bill, mods) * 0.35;
  }
  return 0;
}
function rollcalls(bill){
  if(bill.pr === "postpone" || bill.pr === "committee") return [];
  const line = bill.ln !== "none", joined = bill.me === "joined";
  if(bill.pr === "divide"){
    const r = [];
    if(line) r.push({id:"LINE", name:"The line", short:"The line"});
    r.push(joined ? {id:"MEMO", name:"Maine and Missouri", short:"Maine + Missouri"} : {id:"MO", name:"Missouri", short:"Missouri"});
    if(!joined) r.push({id:"ME", name:"Maine", short:"Maine"});
    return r;
  }
  return [{id:"ALL", name:"The whole bill", short:"The bill"}];
}
function blocScore(b, rcId, bill, mods){
  if(rcId === "ALL"){
    const comps = bill.me === "joined" ? ["MEMO"] : ["MO", "ME"];
    if(bill.ln !== "none") comps.push("LINE");
    return Math.min(...comps.map(c => compScore(b, c, bill, mods, false)));
  }
  return compScore(b, rcId, bill, mods, true);
}
const memberScore = (m, rcId, bill, mods) => blocScore(m.bloc, rcId, bill, mods) + BLOCS[m.bloc].sigma * m.z;

/* ---------------- voting ---------------- */
const ATTEND = {R:0.95, M:1, C:0.90, W:0.78, B:0.80, H:0.97};
function attendance(members, bill, rng){
  const out = {};
  for(const m of members) out[m.id] = bill.pr === "late" ? (rng() < ATTEND[m.bloc]) : true;
  return out;
}
function runVote(members, bill, mods, rng){
  const rcs = rollcalls(bill);
  const att = attendance(members, bill, rng);
  const present = members.filter(m => att[m.id]);
  const need = Math.floor(present.length / 2) + 1;
  const results = [];
  for(const rc of rcs){
    const eta = {}; BLOC_IDS.forEach(b => eta[b] = gauss(rng) * 0.35);
    let aye = 0, nay = 0; const votes = {};
    for(const m of present){
      const v = memberScore(m, rc.id, bill, mods) + eta[m.bloc] + gauss(rng) * 0.30 > 0;
      votes[m.id] = v; v ? aye++ : nay++;
    }
    results.push({id:rc.id, name:rc.name, short:rc.short, aye, nay, need, pass:aye >= need, votes});
  }
  return {results, present:present.length, need, att};
}
function senateP(bill, day, mods){
  if(!(bill.mo === "silent" || bill.mo === "open")) return 0.02;
  let p = {joined:0.96, twin:0.95, pledge:0.35, alone:0.10, extend:0.10}[bill.me];
  p += {none:0, "40":0, sunset:0, "3630":0.03, pacific:-0.15, arkansas:-0.5}[bill.ln];
  if(bill.sw.includes("tariff_up")) p -= 0.05;
  if(bill.sw.includes("monroe")) p += 0.03;
  if(bill.pr === "late") p -= 0.05;
  if(day >= 8 && bill.me !== "alone") p -= 0.03;
  return clamp(p, 0.01, 0.97);

/* ---------------- what the captains can see ---------------- */
const catOf = r => r < -1 ? -2 : r < -0.3 ? -1 : r < 0.3 ? 0 : r < 1 ? 1 : 2;
function readBloc(members, blocId, bill, mods, rng){
  const t = TRAITS[blocId], out = {};
  for(const rc of rollcalls(bill)){
    out[rc.id] = members.filter(m => m.bloc === blocId).map(m => ({id:m.id, cat:catOf(memberScore(m, rc.id, bill, mods) + t.bias + gauss(rng) * t.noise)}));
  }
  return out;

const ayeBelief = arr => arr.filter(x => x.cat >= 1).length + 0.5 * arr.filter(x => x.cat === 0).length;

  const rcs = rollcalls(bill);
  if(!rcs.length) return null;
  return (rcs.find(r => r.id === "MO" || r.id === "MEMO" || r.id === "ALL")).id;
}

function blocShift(blocId, billOld, billNew, mods){
  const a = rollcalls(billOld).map(r => r.id).join(), b = rollcalls(billNew).map(r => r.id).join();
  if(a !== b) return 9;

  for(const rc of rollcalls(billNew)) mx = Math.max(mx, Math.abs(blocScore(blocId, rc.id, billNew, mods) - blocScore(blocId, rc.id, billOld, mods)));

}

/* ---------------------------------------------------------------- helpers */
const _pick = (arr, rng) => arr[Math.floor(rng() * arr.length)];
const _NUM = ["none","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const numWord = n => n <= 20 ? _NUM[n] : String(n);
function fuzz(n, rng){
  n = Math.round(n);
  if(n <= 1) return n <= 0 ? "none" : "one, perhaps";
  if(rng() < 0.5) return numWord(n - 1) + " or " + numWord(n);
  return numWord(n) + " or " + numWord(n + 1);
}
function estBucket(n, size){
  const f = n / size;
  return f <= 0.03 ? "none" : f <= 0.12 ? "few" : f <= 0.3 ? "some" : f <= 0.5 ? "nearly" : f <= 0.65 ? "half" : f <= 0.85 ? "most" : "all";
}
function estimateLine(cap, arr, rcName, size, rng){
  const n = arr.filter(x => x.cat >= 1).length + 0.5 * arr.filter(x => x.cat === 0).length;
  const spoken = cap.id === "randolph" ? Math.max(0, n - 2) : cap.id === "whitcomb" ? Math.min(size * 0.94, n * 1.1 + 0.5) : n;
  const key = estBucket(spoken, size);
  return cap.est[key].replace("{rc}", rcName).replace("{fz}", fuzz(spoken, rng)).replace("{nw}", numWord(Math.round(spoken)));
}
const RC_SPOKEN = {ALL:"the bill as a whole", LINE:"the line", MO:"Missouri", ME:"Maine", MEMO:"Maine and Missouri together"};

/* Every option currently in the bill, as "art:id" keys. */
function billKeys(bill){ return ["me:" + bill.me, "mo:" + bill.mo, "ln:" + bill.ln, "pr:" + bill.pr].concat(bill.sw.map(s => "sw:" + s)); }
function keyParts(k){ const i = k.indexOf(":"); return [k.slice(0, i), k.slice(i + 1)]; }
function withoutKey(bill, k){
  const [a, id] = keyParts(k), b = cloneBill(bill);
  if(a === "sw") b.sw = b.sw.filter(x => x !== id);
  else b[a] = ARTICLES.find(x => x.id === a).def;
  return b;
}
function withKey(bill, k){
  const [a, id] = keyParts(k), b = cloneBill(bill);
  if(a === "sw"){ if(!b.sw.includes(id)) b.sw.push(id); } else b[a] = id;
  return b;
}
/* Expected ayes for a bloc on the captain's chosen roll call */
function blocAyes(members, blocId, bill, mods){
  const rc = mainRc(bill); if(!rc) return 0;
  return expectedAyes(members, blocId, rc, bill, mods);
}

/* ---------------------------------------------------------------- composer */
/* ctx: {cap, bill, mods, members, visits, day, lastFail, unlocked:Set, reads:{rcId:[{id,cat}]}, favorsLeft, rng}
   returns {bubbles:[{text, ex, tag?}], notes:{est:[], ask:""}, unlocks:[], friends:[]} */
function composeHouse(ctx){
  const C = CAST[ctx.cap], b = C.bloc, rng = ctx.rng, bill = ctx.bill;
  const out = {bubbles:[], notes:{est:[], ask:""}, unlocks:[], friend:null};
  const push = (arr, tag) => out.bubbles.push({text:arr[0], ex:arr[1] || "neutral", tag});

  // 1. opener
  const pool = ctx.lastFail && rng() < 0.7 ? C.open.afterFail : ctx.day >= 9 && rng() < 0.6 ? C.open.late : (ctx.visits <= 1 ? C.open.first : C.open.again);
  push([_pick(pool, rng), "neutral"]);

  // 2. mention (occasional), Calhoun/Webster/Clay texture
  if(C.mention.length && ctx.visits >= 2 && rng() < 0.35) push(_pick(C.mention, rng));

  // 3. reactions to the terms that matter most to this bloc
  const cands = [];
  for(const k of billKeys(bill)){
    if(!C.react[k]) continue;
    const d = blocAyes(ctx.members, b, bill, ctx.mods) - blocAyes(ctx.members, b, withoutKey(bill, k), ctx.mods);
    cands.push({k, d, ad:Math.abs(d)});
  }
  cands.sort((x, y) => y.ad - x.ad);
  const chosen = cands.filter((c, i) => i === 0 || (i === 1 && c.ad >= 1.5));
  if(chosen.length) chosen.forEach(c => push(C.react[c.k]));
  else {
    const tot = blocAyes(ctx.members, b, bill, ctx.mods) / BLOCS[b].size;
    push(tot > 0.5 ? C.generic.pos : C.generic.neg);
  }

  // 4. estimates (this is when the floor moves)
  const rcs = Object.keys(ctx.reads);
  const size = BLOCS[b].size;
  let shown = 0;
  rcs.forEach((rcId, i) => {
    const arr = ctx.reads[rcId], n = ayeBelief(arr);
    const interesting = i === 0 || (n > 0.05 * size && n < 0.95 * size);
    if(!interesting || shown >= 2) return;
    const line = estimateLine(C, arr, RC_SPOKEN[rcId] || rcId, size, rng);
    out.notes.est.push(line);
    out.bubbles.push({text:line, ex:n / size > 0.5 ? "warm" : n / size > 0.2 ? "neutral" : "worried", tag:"reveal"});
    shown++;
  });

  // 5. the ask: the change that would help this bloc most (drawn only from ideas the captain has a line for)
  const alts = [];
  for(const k of Object.keys(C.ask)){
    if(billKeys(bill).includes(k)) continue;
    const [a, id] = keyParts(k);
    if(OPTS[a].find(o => o.id === id && o.lock) && !ctx.unlocked.has(k)) {
      // captains may still mention locked ideas; that is how they unlock
    }
    if(a === "sw" && (billCost(bill) + swCost(id) > START_FAVORS)) continue;
    const d = blocAyes(ctx.members, b, withKey(bill, k), ctx.mods) - blocAyes(ctx.members, b, bill, ctx.mods);
    alts.push({k, d, pet:k === C.pet});
  }
  alts.sort((x, y) => y.d - x.d);
  let ask = alts.find(a => a.d >= 2);
  if(alts.length && (!ask || (rng() < 0.3))){
    const petAlt = alts.find(a => a.pet && a.d >= 0.3);
    if(petAlt) ask = petAlt;
  }
  if(ask){
    const line = C.ask[ask.k];
    out.notes.ask = line[0];
    out.bubbles.push({text:line[0], ex:line[1], tag:"ask", key:ask.k});
    if(ask.k === "me:twin") out.unlocks.push("me:twin");
    if(ask.k === "ln:3630") out.unlocks.push("ln:3630");
  } else {
    out._fallback = blocAyes(ctx.members, b, bill, ctx.mods) / BLOCS[b].size > 0.8 ? ["I would not change a word, Mr. Speaker. That will not last.", "warm"] : ["I cannot think how to help you more. That is not a good feeling.", "worried"];
  }

  // 6. hidden unlock triggers that come out of conversation
  if(ctx.cap === "holmes" && (bill.me === "joined" || bill.me === "alone") && !ctx.unlocked.has("me:twin") && !out.unlocks.includes("me:twin")){
    out.bubbles.push({text:C.ask["me:twin"][0], ex:"neutral", tag:"unlock"});
    out.unlocks.push("me:twin");
  }
  if((ctx.cap === "whitcomb" || ctx.cap === "taylor") && !ctx.unlocked.has("ln:3630")){
    out.bubbles.push({text:ctx.cap === "whitcomb" ? "Someone in the Senate talks about a line at 36 degrees 30 minutes, along Missouri’s southern edge. Ask Mr. Thomas about it." : "There is talk of a line at 36 degrees 30 minutes, running west from Missouri’s southern border. Ask Mr. Thomas. I will not pretend I have not heard it.", ex:"neutral", map:"3630", tag:"unlock"});
    out.unlocks.push("ln:3630");
  }

  if(out._fallback && !out.bubbles.some(x => x.tag === "unlock")) push(out._fallback);
  delete out._fallback;

  // 7. ambition, sparingly
  if(C.ambition && ctx.visits >= 2 && C.ambition.when(bill) && rng() < 0.55){
    out.bubbles.push({text:C.ambition.text, ex:ctx.cap === "randolph" ? "angry" : "warm", tag:"ambition"});
    if(C.ambition.friend) out.friend = C.ambition.friend;
  }
  return out;
}

/* The Senate: what would it accept, and how does the scale read? */
function senateRead(p){
  return p < 0.12 ? ["The Senate will ignore this bill.", "skeptical"]
       : p < 0.4  ? ["I doubt it will pass. I would not bet on it.", "skeptical"]
       : p < 0.7  ? ["I cannot say yes or no. It depends on who comes to vote.", "neutral"]
       : p < 0.88 ? ["I think we have enough votes. Not all. Enough.", "warm"]
       :            ["I call that settled. Nothing here is ever fully settled, but I call it settled.", "amused"];
}
function composeSenate(ctx){
  const bill = ctx.bill, rng = ctx.rng, C = CAST.thomas;
  const out = {bubbles:[], notes:{est:[], ask:""}, unlocks:[], friend:null, scale:null};
  const push = (arr, tag) => out.bubbles.push({text:arr[0], ex:arr[1] || "neutral", tag});
  const unres = bill.mo === "silent" || bill.mo === "open";
  push([_pick(ctx.lastFail && rng() < 0.7 ? C.open.afterFail : ctx.day >= 9 && rng() < 0.6 ? C.open.late : (ctx.visits <= 1 ? C.open.first : C.open.again), rng), "neutral"]);

  // Missouri terms
  if(!unres){
    push(["The Senate will not accept a limit on Missouri. Not this week or next. Do not waste your evenings on it.", "skeptical"]);
  } else if(bill.mo === "open"){
    push(["You say slavery is legal in Missouri. Some senators wanted silence, but they will not vote against honesty.", "neutral"]);
  } else {
    push(["Missouri on an equal footing, and nothing more. That is what the Senate wants.", "neutral"]);
  }
  // Maine terms
  if(unres){
    const m = {
      alone:["Maine alone would make it 12 free states to 11 slave. The Senate will fight until March.", "skeptical"],
      joined:["Joined. That is the Senate’s own plan. If the House accepts it, so will we.", "warm"],
      twin:["Two bills sent as a pair. The Senate will look at that if both arrive together. Do not send one without the other.", "warm"],
      pledge:["A promise is not enough. The Senate has had promises before. It wants a bill.", "skeptical"],
      extend:["That is Massachusetts’s law, not ours. We cannot change a law we did not write.", "amused"]
    }[bill.me];
    push(m);
    if((bill.me === "alone" || bill.me === "pledge" || bill.me === "extend")){
      out.bubbles.push({text:"The Senate only cares that the two states move together. It can be one bill or two. I mention it as a matter of grammar.", ex:"amused", tag:"unlock"});
      out.unlocks.push("me:twin");
    }
  }
  // Line
  const L = {
    none:null,
    "3630":["The line is my idea. I offered it to win a few Northern votes. If it upsets your Southern men, you may remove it. The Senate will not cry.", "amused"],
    "40":["Forty degrees. The Senate would hardly notice.", "neutral"],
    sunset:["A line that ends. The Senate would accept it. Some of us would prefer it.", "neutral"],
    pacific:["We own nothing at the Pacific, so there is nothing to ban. But Southern members will still be angry.", "skeptical"],
    arkansas:["Arkansas is south of the line. The Senate will not go there, not for you and not for me.", "angry"]
  }[bill.ln];
  if(L) push(L);
  if(!ctx.unlocked.has("ln:3630") && bill.ln !== "3630"){
    out.bubbles.push({text:"Some senators talk about a line at 36 degrees 30 minutes. It would run west along Missouri’s southern border. Slavery would be banned north of it, except in Missouri itself. I offer it only as an idea.", ex:"neutral", map:"3630", tag:"unlock"});
    out.unlocks.push("ln:3630");
  }
  // Clock
  if(ctx.day >= 8 && rng() < 0.6) push(["The deadline belongs to Massachusetts, not to us. As time gets short, the price of Maine goes up.", "skeptical"]);
  // The read (the scale moves)
  const p = senateP(bill, ctx.day, ctx.mods);
  // Thomas is honest but not exact
  const fuzzed = clamp(p + (rng() - 0.5) * 0.18, 0, 1);
  out.bubbles.push({text:senateRead(fuzzed)[0], ex:senateRead(fuzzed)[1], tag:"scale"});
  out.notes.est.push(senateRead(fuzzed)[0]);
  out.scale = {me:bill.me, unres, mo:bill.mo};
  return out;
}

if(typeof module !== "undefined") module.exports = {CAST, composeHouse, composeSenate, billKeys, estimateLine};

const STAGE = {W:1200, H:780};

const SHORT_NAME = {R:"Restrictionists", M:"Maine", C:"Cover-seekers", W:"The West", B:"Border moderates", H:"Southern hardliners"};

const CAT_COLOR = {"-2":"#b3352a", "-1":"#c98466", "0":"#c9a53a", "1":"#86ad72", "2":"#3f8a4f"};

/* ---------- the chamber, in ink ---------- */
function chamberBG(){
  const L = (x1, y1, x2, y2, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w || 1.4}"/>`;
  let ink = "", wash = "", ink2 = "", wash2 = "";

  // ceiling: a coffered plane seen from below, converging on the far wall
  let ceil = "";
  for(let i = -10; i <= 10; i++) ceil += L(600 + i * 118, 10, 600 + i * 76, 114, i % 4 === 0 ? 1.8 : 1.0);

  wash += `<path d="M436,28 H764 L730,88 H470 Z" fill="${PAPER}"/>`;
  ink += `<path d="M436,28 H764 L730,88 H470 Z" fill="none" stroke-width="2.4"/><path d="M448,34 H752 L722,82 H478 Z" fill="none" stroke-width="1.2"/>`;
  for(let i = 0; i < 11; i++){ const x = 450 + i * 30; ink += L(x, 34, 600 + (x - 600) * 0.78, 82, 0.9); }

    // capital: two volutes and an abacus

    ink += `<path d="M${x - 20},140 Q${x - 26},128 ${x - 14},128 Q${x - 8},136 ${x - 4},140 M${x + 20},140 Q${x + 26},128 ${x + 14},128 Q${x + 8},136 ${x + 4},140" fill="none" stroke-width="1.3"/>`;
    ink += `<circle cx="${x - 15}" cy="132" r="2.6" fill="none" stroke-width="1"/><circle cx="${x + 15}" cy="132" r="2.6" fill="none" stroke-width="1"/>`;
    // base
    ink += `<rect x="${x - 21}" y="262" width="42" height="9" fill="${PAPER}" stroke-width="1.6"/><rect x="${x - 25}" y="271" width="50" height="6" fill="${PAPER}" stroke-width="1.4"/>`;

/* ---------- geometry ---------- */
let _geo = null;
function chamberGeometry(){
  if(_geo) return _geo;
  const cols = {}; let total = 0;
  BLOC_IDS.forEach(b => { cols[b] = Math.ceil(BLOCS[b].size / ROWS); total += cols[b]; });
  const usable = STAGE.W - 2 * MARGIN - SEC_GAP * (BLOC_IDS.length - 1), colW = usable / total;
  let x = MARGIN; const sections = {};
  BLOC_IDS.forEach(b => { const w = cols[b] * colW; sections[b] = {x0:x, x1:x + w, cx:x + w / 2, cols:cols[b], colW}; x += w + SEC_GAP; });
  return (_geo = {sections, colW});
}
function penRect(i){ const w = PEN.w / 5; return {x:PEN.x0 + i * w, w, y:PEN.y0, h:PEN.y1 - PEN.y0}; }
function penBG(){
  let s = "";
  CATS.forEach((c, i) => {
    const r = penRect(i), col = CAT_COLOR[c];
    s += `<g><path d="M${r.x + 4},${r.y + 4} H${r.x + r.w - 4} V${r.y + r.h} H${r.x + 4} Z" fill="${col}" fill-opacity=".14"/>
      <path d="M${r.x + 4},${r.y + 4} H${r.x + r.w - 4} V${r.y + r.h} H${r.x + 4} Z" fill="url(#dots)" opacity=".18"/>
      <rect x="${r.x + 4}" y="${r.y + 4}" width="${r.w - 8}" height="26" fill="${col}" fill-opacity=".85"/>
      <text x="${r.x + r.w / 2}" y="${r.y + 23}" text-anchor="middle" font-family='${SERIF}' font-size="17" font-style="italic" fill="#fbf3dd">${CAT_LABEL[c]}</text>
      <path d="M${r.x + 4},${r.y + r.h} H${r.x + r.w - 4}" stroke="${INK}" stroke-width="2.2" opacity=".55"/>
      <path d="M${r.x + 4},${r.y + 4} V${r.y + r.h} M${r.x + r.w - 4},${r.y + 4} V${r.y + r.h}" stroke="${INK}" stroke-width="1.2" stroke-dasharray="5 5" opacity=".5"/></g>`;
  });
  return s;
}

/* ---------- seats ---------- */
function shuffleInPlace(a, rng){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function layoutSeats(members){
  const rng = mulberry32(77), geo = chamberGeometry();
  BLOC_IDS.forEach(b => {
    const sec = geo.sections[b], seats = [];
    for(let c = 0; c < sec.cols; c++) for(let r = 0; r < ROWS; r++) seats.push({c, r});
    const extra = seats.length - BLOCS[b].size;
    const capIdx = seats.findIndex(s => s.r === ROWS - 1 && s.c === Math.floor(sec.cols / 2));
    // drop the extras from the back rows first
    const order = seats.map((s, i) => ({i, k:s.r * 10 + rng()})).filter(o => o.i !== capIdx).sort((a, b2) => a.k - b2.k);
    const drop = new Set(order.slice(0, extra).map(o => o.i));
    const keep = seats.filter((s, i) => !drop.has(i));
    const mem = members.filter(m => m.bloc === b);
    const capSeat = seats[capIdx];
    const others = shuffleInPlace(keep.filter(s => s !== capSeat), rng), rest = mem.filter(m => !m.captain);
    mem.filter(m => m.captain).forEach(m => { m.seat = seatXY(sec, capSeat); });
    rest.forEach((m, i) => { m.seat = seatXY(sec, others[i]); });
  });
}
function seatXY(sec, s){ return {x:sec.x0 + (s.c + 0.5) * sec.colW + (s.r % 2 ? 2 : -2), y:ROW_Y[s.r], s:ROW_S[s.r], row:s.r}; }

/* ---------- pens: where a sprite stands for a given category ---------- */
function penSlots(list){ // list: [{id, cat, bloc, idx}] -> {id:{x,y,s}}
  const out = {};
  CATS.forEach((c, i) => {
    const group = list.filter(m => m.cat === c).sort((a, b) => BLOC_IDS.indexOf(a.bloc) - BLOC_IDS.indexOf(b.bloc) || a.idx - b.idx);
    const r = penRect(i), n = group.length; if(!n) return;
    const areaW = r.w - 22, areaH = r.h - 50;
    let k = 1;
    for(; k > 0.5; k -= 0.04){
      const dx = 23 * k, dy = 24 * k, per = Math.floor(areaW / dx), rows = Math.floor(areaH / dy);
      if(per * rows >= n) break;
    }
    k = Math.max(k, 0.5);
    const dx = 23 * k, dy = 24 * k, per = Math.max(1, Math.floor(areaW / dx));
    const rowsUsed = Math.ceil(n / per);
    group.forEach((m, j) => {
      const row = Math.floor(j / per), colIdx = j % per;
      const inRow = row === rowsUsed - 1 ? n - row * per : per;
      const x0 = r.x + r.w / 2 - (inRow * dx) / 2 + dx / 2;
      out[m.id] = {x:x0 + colIdx * dx + ((row % 2) ? 2 : -2), y:r.y + r.h - 8 - row * dy, s:k * 0.95};
    });
  });
  return out;
}

              open:`<ellipse cx="150" cy="${212 + dy}" rx="${9 * w}" ry="5" fill="#4a1d18" stroke="${INK}" stroke-width="1.5"/>`};

  const F = FACES[id], E = EXPR[exprName] || EXPR.neutral;

  // background tondo
  col.push(`<circle cx="150" cy="176" r="150" fill="${F.bg}"/><circle cx="150" cy="176" r="150" fill="url(#dotsL)" opacity=".28"/>`);
  key.push(`<circle cx="150" cy="176" r="150" fill="none" stroke="${INK}" stroke-width="2.4"/>`);

  // coat and waistcoat
  add("M14,360 C20,318 62,296 112,286 L188,286 C238,296 280,318 286,360 Z", F.coat, 2.6);
  add("M122,292 L150,360 L178,292 L150,284 Z", F.vest, 1.8);

  // collar and cravat
  const ch = F.collarHigh ? 14 : 0;
  add(`M106,266 L120,${222 - ch} L138,240 L138,284 L112,292 Z`, F.collar, 2);
  add(`M194,266 L180,${222 - ch} L162,240 L162,284 L188,292 Z`, F.collar, 2);
  add("M124,262 Q150,282 176,262 L178,282 Q150,302 122,282 Z", "#fbf7ea", 1.8);
  key.push(`<path d="M150,270 L146,296 M150,270 L154,296" stroke="${INK}" stroke-width="1" fill="none" opacity=".7"/>`);

  // head group, scaled for variety
  const H = [], HK = [];
  const hadd = (d, fill, w, extra) => { H.push(`<path d="${d}" fill="${fill}"/>`); HK.push(`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w || 2}" stroke-linejoin="round" stroke-linecap="round" ${extra || ""}/>`); };
  const earS = F.ears || 1;
  hadd(`M97,140 C${86 - 4 * (earS - 1)},138 ${84 - 4 * (earS - 1)},158 90,170 C93,177 98,176 99,172 Z`, F.skin, 1.8);
  hadd(`M203,140 C${214 + 4 * (earS - 1)},138 ${216 + 4 * (earS - 1)},158 210,170 C207,177 202,176 201,172 Z`, F.skin, 1.8);
  const face = "M150,76 C192,76 206,108 204,140 C202,176 194,206 176,224 C166,234 158,238 150,238 C142,238 134,234 124,224 C106,206 98,176 96,140 C94,108 108,76 150,76 Z";
  hadd(face, F.skin, 2.6);
  // shade plates
  H.push(`<path d="M150,76 C192,76 206,108 204,140 C202,176 194,206 176,224 C166,234 158,238 150,238 C170,204 176,146 150,76 Z" fill="${F.shade}" opacity=".55"/><path d="M150,76 C192,76 206,108 204,140 C202,176 194,206 176,224 C166,234 158,238 150,238 C170,204 176,146 150,76 Z" fill="url(#ht-${id})" opacity=".9"/>`);
  if(F.cheek) H.push(`<circle cx="116" cy="184" r="14" fill="#e08a70" opacity=".32"/><circle cx="184" cy="184" r="14" fill="#e08a70" opacity=".32"/>`);
  if(F.hollow) H.push(`<path d="M104,170 Q112,196 130,214 Q112,200 104,170 Z M196,170 Q188,196 170,214 Q188,200 196,170 Z" fill="${F.shade}" opacity=".7"/>`);
  // hair
  const hs = hairShapes(F.hairStyle);
  hs.d.forEach(d => hadd(d, F.hair, 2.4));
  hs.side.forEach(d => hadd(d, F.hair, 1.6));
  if(hs.line) HK.push(`<path d="${hs.line}" fill="none" stroke="${INK}" stroke-width="1.2" opacity=".55"/><path d="${hs.line}" fill="none" stroke="#fff" stroke-width="1" opacity=".18" transform="translate(2 3)"/>`);
  H.push(`<path d="${hs.d[0]}" fill="url(#htK)" opacity=".35"/>`);

  // features: line only (key plate)
  const by = 132 - F.brow * 0, bw = F.brow;
  const bl = E.L, br = E.R;
  const browL = `M106,${by + bl[0]} Q124,${by + bl[1] - 6} 142,${by + bl[2]}`;
  const browR = `M158,${by + br[2]} Q176,${by + br[1] - 6} 194,${by + br[0]}`;
  HK.push(`<path d="${browL}" fill="none" stroke="${F.browC}" stroke-width="${bw + 2}" stroke-linecap="round"/><path d="${browR}" fill="none" stroke="${F.browC}" stroke-width="${bw + 2}" stroke-linecap="round"/>`);
  const eo = E.eye, eh = 8.6 * eo * (F.bigEyes ? 1.2 : 1), eyeY = 146;
  const gaze = -3;
  const eye = (cx) => `<path d="M${cx - 16},${eyeY} Q${cx},${eyeY - eh - 2} ${cx + 16},${eyeY} Q${cx},${eyeY + eh * 0.7 + 1} ${cx - 16},${eyeY} Z" fill="#fbf6ea" stroke="${INK}" stroke-width="1.7"/>` +
                   `<circle cx="${cx + gaze}" cy="${eyeY}" r="${5.4 * (F.bigEyes ? 1.15 : 1)}" fill="${F.iris}" stroke="${INK}" stroke-width="1"/><circle cx="${cx + gaze}" cy="${eyeY}" r="2.4" fill="#0c0805"/><circle cx="${cx + gaze - 1.8}" cy="${eyeY - 1.8}" r="1.3" fill="#fff"/>` +
                   `<path d="M${cx - 16},${eyeY} Q${cx},${eyeY - eh - 2} ${cx + 16},${eyeY}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>` +
                   `<path class="lid" d="M${cx - 17},${eyeY - 1} Q${cx},${eyeY - eh - 3} ${cx + 17},${eyeY - 1} L${cx + 17},${eyeY + 2} Q${cx},${eyeY + eh * 0.7 + 2} ${cx - 17},${eyeY + 2} Z" fill="${F.skin}" stroke="${INK}" stroke-width="1.6"/>`;
  HK.push(eye(125) + eye(175));
  HK.push(`<path d="M112,${eyeY + 8} Q125,${eyeY + 12} 138,${eyeY + 8} M162,${eyeY + 8} Q175,${eyeY + 12} 188,${eyeY + 8}" fill="none" stroke="${INK}" stroke-width="0.9" opacity=".4"/>`);
  // nose
  const [nw, nl] = F.nose;
  HK.push(`<g transform="translate(150 146) scale(${nw} ${nl}) translate(-150 -146)"><path d="M146,148 C145,162 142,174 138,183" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M138,184 C142,191 148,193 150,193 C152,193 158,191 162,184" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M154,152 C156,164 160,176 163,184" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".5"/><circle cx="143" cy="188" r="1.3" fill="${INK}"/><circle cx="157" cy="188" r="1.3" fill="${INK}"/></g>`);
  // wrinkles by age
  if(F.age === "m" || F.age === "o") HK.push(`<path d="M124,190 Q119,202 125,214 M176,190 Q181,202 175,214" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".5"/><path d="M116,116 Q150,110 184,116" fill="none" stroke="${INK}" stroke-width="0.9" opacity=".35"/>`);
  if(F.age === "o") HK.push(`<path d="M104,152 l-8,-3 M104,156 l-9,2 M196,152 l8,-3 M196,156 l9,2" stroke="${INK}" stroke-width="0.9" opacity=".5"/><path d="M118,122 Q150,116 182,122" fill="none" stroke="${INK}" stroke-width="0.9" opacity=".4"/>`);
  if(F.side) H.push(`<path d="M99,158 L96,200 L108,196 L108,160 Z M201,158 L204,200 L192,196 L192,160 Z" fill="${F.hair}" opacity=".9"/>`);
  // mouth
  const mo = mouthShapes(E.mouth, F.mouthY, F.mouthW);
  HK.push(`<g class="m m-closed">${mo.closed}</g><g class="m m-open">${mo.open}</g>`);
  // spectacles
  if(F.extra === "specs") HK.push(`<circle cx="125" cy="146" r="17" fill="#fff" fill-opacity=".12" stroke="#4a4030" stroke-width="2"/><circle cx="175" cy="146" r="17" fill="#fff" fill-opacity=".12" stroke="#4a4030" stroke-width="2"/><path d="M142,144 Q150,140 158,144 M108,144 L98,140 M192,144 L202,140" fill="none" stroke="#4a4030" stroke-width="2"/>`);

  const sx = F.sx, sy = F.sy;
  const headT = `translate(150 150) scale(${sx} ${sy}) translate(-150 -150)`;

  // extras (lower-third props)
  let extraC = "", extraK = "";
  switch(F.extra){
    case "paper":
      extraC = `<g transform="translate(196 300) rotate(-12)"><rect width="66" height="46" fill="#f6eed6"/></g>`;
      extraK = `<g transform="translate(196 300) rotate(-12)"><rect width="66" height="46" fill="none" stroke="${INK}" stroke-width="2"/><path d="M8,10 H58 M8,18 H52 M8,26 H56 M8,34 H40" stroke="${INK}" stroke-width="1.2" opacity=".6"/></g>`; break;
    case "chain":
      extraK = `<path d="M116,312 Q150,342 184,312" fill="none" stroke="#c39a2a" stroke-width="3"/><circle cx="184" cy="314" r="7" fill="#e6c14e" stroke="${INK}" stroke-width="1.6"/><path d="M130,300 l6,14 M170,300 l-6,14" stroke="${INK}" stroke-width="1"/>`; break;
    case "pencil":
      extraK = `<path d="M204,128 L222,98" stroke="#d9a520" stroke-width="5" stroke-linecap="round"/><path d="M204,128 L222,98" stroke="${INK}" stroke-width="1.2"/>`; break;
    case "map":
      extraC = `<g transform="translate(184 312) rotate(-22)"><rect width="84" height="20" rx="10" fill="#f0e2bc"/></g>`;
      extraK = `<g transform="translate(184 312) rotate(-22)"><rect width="84" height="20" rx="10" fill="none" stroke="${INK}" stroke-width="2"/><circle cx="10" cy="10" r="6" fill="none" stroke="${INK}" stroke-width="1.4"/><path d="M26,6 Q40,14 54,7 M30,14 Q44,8 60,15" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".6"/></g>`; break;
    case "hanky":
      extraC = `<path d="M206,306 Q226,292 244,306 Q250,326 230,334 Q208,330 206,306 Z" fill="#faf5e6"/>`;
      extraK = `<path d="M206,306 Q226,292 244,306 Q250,326 230,334 Q208,330 206,306 Z" fill="none" stroke="${INK}" stroke-width="1.8"/><path d="M216,308 Q228,316 240,310" fill="none" stroke="${INK}" stroke-width="1" opacity=".5"/>`; break;
    case "whip":
      extraK = `<path d="M268,360 L214,244" stroke="#3a2618" stroke-width="5" stroke-linecap="round"/><path d="M214,244 Q196,214 224,196 Q240,188 232,172" fill="none" stroke="#3a2618" stroke-width="2.4" stroke-linecap="round"/><path d="M268,360 L214,244" stroke="${INK}" stroke-width="1" opacity=".6"/>`;
      extraC = `<path d="M20,360 L22,322 C26,298 48,288 70,292 C88,294 102,302 110,314 L114,324 C108,329 100,329 94,326 C90,342 84,352 78,360 Z" fill="#c69a5e"/><path d="M44,296 C32,300 26,324 34,346 C48,340 56,318 54,298 Z" fill="#8a6437"/>`;
      extraK += `<path d="M20,360 L22,322 C26,298 48,288 70,292 C88,294 102,302 110,314 L114,324 C108,329 100,329 94,326 C90,342 84,352 78,360" fill="none" stroke="${INK}" stroke-width="2.2"/><path d="M44,296 C32,300 26,324 34,346 C48,340 56,318 54,298 Z" fill="none" stroke="${INK}" stroke-width="1.8"/><circle cx="78" cy="308" r="3" fill="${INK}"/><circle cx="110" cy="318" r="4.2" fill="${INK}"/>`; break;
  }
  const grain = `<rect width="300" height="360" filter="url(#paper)" opacity=".5" style="mix-blend-mode:multiply"/>`;
  return `<g class="portrait ${exprName}" clip-path="url(#pclip)">
      <g class="col" transform="${LITHO_OFF}">${col.join("")}<g transform="${headT}">${H.join("")}</g>${extraC}</g>

      ${grain}
    </g>`;
}

function portraitDefs(){
  let ht = "";
  const dot = (id, c, r, sz) => `<pattern id="${id}" width="${sz}" height="${sz}" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="${c}"/></pattern>`;
  Object.keys(FACES).forEach(k => { ht += dot("ht-" + k, FACES[k].shade, 1.5, 4.2); });
  ht += dot("ht-clay", "#b98456", 1.5, 4.2) + dot("htK", INK, 1.1, 4.4) + dot("dotsL", "#fff", 1.2, 5);
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${ht}
    <clipPath id="pclip"><rect width="300" height="360"/></clipPath>
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="t"/><feColorMatrix in="t" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.26  0 0 0 0 0.14  0 0 0 0.22 0"/></filter>
  </defs></svg>`;
}

function tone(f, d, type, vol, when){ const a = ac(); if(!a) return; const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03); }
function thump(when, vol){ const a = ac(); if(!a) return; const t = a.currentTime + (when || 0), n = a.createBufferSource(), len = Math.floor(a.sampleRate * 0.16), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); n.buffer = buf; const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 520; const g = a.createGain(); g.gain.value = vol || 0.5; n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); }

/* ---------------- typewriter ---------------- */
function typer(el, text, cps){
  cps = (FAST || G.instant) ? 1e7 : (cps || 62);
  let i = 0, done = false, cb = null, raf = 0; const t0 = performance.now();
  el.textContent = "";
  const finish = () => { done = true; el.textContent = text; if(cb) cb(); };
  function tick(now){
    const n = Math.min(text.length, Math.floor((now - t0) / 1000 * cps));
    if(n !== i){ i = n; el.textContent = text.slice(0, i); if(i % 3 === 0) sfx.tick(); }
    if(i >= text.length) finish(); else raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  return {skip(){ if(done) return; cancelAnimationFrame(raf); finish(); }, get done(){ return done; }, onDone(f){ if(done) f(); else cb = f; }};
}

function buildStage(){

    h += `<g class="badge" id="b_${id}" data-cap="${id}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="Speak with ${esc(C.name)}">

    b.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); startTalk(b.dataset.cap); } });
  });
}
function place(m, pos, s, instant, delay){
  const el = m.el, key = Math.round(pos.x) + "," + Math.round(pos.y) + "," + s.toFixed(2);
  if(m.key === key) return;
  m.key = key;
  const toSeat = pos === m.seat, tf = `translate(${pos.x.toFixed(1)}px, ${pos.y.toFixed(1)}px) scale(${s.toFixed(3)})`;
  clearTimeout(m.t);
  if(instant){ el.classList.add("instant"); el.style.transform = tf; el.classList.toggle("seat", toSeat); void el.getBoundingClientRect(); el.classList.remove("instant"); return; }
  el.classList.remove("seat"); el.classList.add("walk");
  el.style.transitionDelay = (delay || 0).toFixed(2) + "s";
  el.style.transform = tf;
  m.t = setTimeout(() => { el.classList.remove("walk"); if(toSeat) el.classList.add("seat"); }, (0.9 + (delay || 0)) * 1000 + 90);
}

function catFor(m, rcId){
  const ex = G.exact[rcId];
  if(ex && ex.sig === billSig(G.bill)){ const v = ex.cats[m.id]; return v === undefined ? null : v; }
  const r = G.reads[m.bloc];
  if(!r || r.stale) return null;
  const map = r.rcs[rcId]; if(!map) return null;
  const v = map[m.id]; return v === undefined ? null : v;
}
function currentRcs(){ return rollcalls(G.bill); }
function ensureRc(){ const rcs = currentRcs(); if(!rcs.find(r => r.id === G.rc)) G.rc = rcs.length ? rcs[0].id : null; return G.rc; }

function renderStage(opts){
  opts = opts || {};
  ensureRc();
  const list = [];
  for(const m of G.members){
    const c = G.rc ? catFor(m, G.rc) : null;
    if(c !== null && c !== undefined && !(opts.absent && opts.absent[m.id])) list.push({id:m.id, cat:c, bloc:m.bloc, idx:m.idx});
  }
  const slots = penSlots(list);
  G.members.forEach(m => {
    const sl = slots[m.id], d = opts.instant ? 0 : Math.random() * 0.5;
    if(sl) place(m, {x:sl.x, y:sl.y}, sl.s, opts.instant, d); else place(m, m.seat, m.seat.s, opts.instant, d);
  });
  // depth order: lower sprites in front
  const g = $("#sprites"), els = G.members.map(m => ({m, y:(slots[m.id] ? slots[m.id].y : m.seat.y)})).sort((a, b) => a.y - b.y);

  const cnt = {"-2":0, "-1":0, "0":0, "1":0, "2":0}; list.forEach(x => cnt[x.cat]++);
  CATS.forEach((c, i) => { const t = $("#pc" + i); if(t) t.textContent = cnt[c]; });

/* ---------------- the passing of days ---------------- */
const MORNING = {
  3:"Rain on the Avenue. The mud is deep, and members complain in the lobby.",
  5:"A cold, clear morning. Someone\u2019s dog is loose in the rotunda.",
  7:"It is Monday again. The Senate met late on Saturday, and news has crossed the building.",
  9:"Candles burned late in every boardinghouse, the houses where members live.",
  10:"Two days are left. Doorkeepers are turning visitors away.",
  11:"The last day before Maine\u2019s 90 days end."
};
const EVENTS = {
  2:{text:"Mr. Randolph spoke for four hours yesterday against any line in the Purchase land. Half the Southern members cheered. The others checked their watches.", fx:m => { m.extra.H = Object.assign({}, m.extra.H, {LINE:-0.3}); }},
  4:{text:"Boston\u2019s letter against spreading slavery is now in Northern newspapers. The cover-seekers are more nervous today.", fx:m => { m.extra.C = Object.assign({}, m.extra.C, {MO:-0.25}); }},
  6:{text:"Letters from the West describe the money crisis of 1819, called the Panic. Every Western member is thinking about land.", fx:m => { m.riderMult.W = 1.3; }},
  8:{text:"Massachusetts voted again. The 90 days stand. No one in Boston will give Maine more time.", fx:() => {}}
};
function blocShiftSince(bl, r){
  const rcs = currentRcs().map(x => x.id);
  if(Object.keys(r.rcs).sort().join() !== rcs.slice().sort().join()) return 9;
  let mx = 0;
  for(const id of rcs) mx = Math.max(mx, Math.abs(blocScore(bl, id, G.bill, G.mods) - blocScore(bl, id, r.bill, r.mods)));
  return mx;
}
function advanceDays(n){
  const notes = [], rng = mulberry32(G.seed * 31 + G.day * 7 + n);
  for(let k = 0; k < n; k++){
    G.day++;
    if(G.day > TOTAL_DAYS) return {over:true, notes};
    if(EVENTS[G.day]){ EVENTS[G.day].fx(G.mods); notes.push(EVENTS[G.day].text); }
    else if(MORNING[G.day]) notes.push(MORNING[G.day]);
  }
  G.actions = ACTIONS_PER_DAY;
  const stale = [];
  BLOC_IDS.forEach(b => {
    const r = G.reads[b]; if(!r || r.stale) return;
    const d = blocShiftSince(b, r);
    if(d > 0.5 || (d > 0.25 && rng() < 0.5) || rng() < 0.08){ r.stale = true; stale.push(BLOCS[b].name); }
  });
  return {over:false, notes, stale};
}
