/* ---------------- interviews ---------------- */
function scaleState(bill){
  let free = 11, slave = 11;
  if(bill.me !== "extend") free += 1;
  if(bill.me === "joined" || bill.me === "twin"){
    if(bill.mo === "silent" || bill.mo === "open") slave += 1;
    else if(bill.mo === "ban" || bill.mo === "tallmadge" || bill.mo === "gradual") free += 1;
  }
  return {free, slave};
}
function commitReads(bloc, reads){
  const rcs = {};
  Object.entries(reads).forEach(([rc, arr]) => { const m = {}; arr.forEach(x => m[x.id] = x.cat); rcs[rc] = m; });
  G.reads[bloc] = {day:G.day, bill:cloneBill(G.bill), mods:JSON.parse(JSON.stringify(G.mods)), stale:false, rcs};
}
function talkShell(capId){
  const C = CAST[capId];
  $("#panel").innerHTML = `<div class="talkview"><div class="scene" id="scene"></div>
    <div class="nameplate"><b>${esc(C.name)}</b><span>${esc(C.role)}</span></div><div id="scalebox"></div>
    <div class="bubble" id="bubble" tabindex="0" aria-live="polite"><span id="btext"></span></div>
    <div class="talkfoot"><span class="sk">Tap the text to show it all at once.</span><button class="btn" id="tnext" disabled>Continue</button></div></div>`;
}
function showMapBox(opt){
  const box = $("#scalebox"); if(!box) return;
  box.className = "scalebox mapbox";
  box.innerHTML = mapMarkup(opt) + `<div class="cap">${esc(MAP_CAPTION[opt] || "")}</div>`;
}
function showScale(bill, verdictLine){
  const s = scaleState(bill), box = $("#scalebox");
  box.className = "scalebox";
  box.innerHTML = scaleMarkup() + `<div class="cap" id="scap"></div>`;
  const beam = $(".beam", box), deg = Math.max(-24, Math.min(24, (s.slave - s.free) * 7));
  $(".cntL", box).textContent = s.free; $(".cntR", box).textContent = s.slave;
  $("#scap").textContent = s.free === s.slave ? "Even. The Senate can accept that." : (s.free > s.slave ? "Free states lead by " + (s.free - s.slave) + ". The slave states will not accept that." : "Slave states lead by " + (s.slave - s.free) + ". The free states will not accept that.");
  const pl = $(".panL", box), pr = $(".panR", box);
  [[pl, 40], [pr, 280]].forEach(([el, x]) => { el.style.transformOrigin = x + "px 60px"; el.style.transition = "transform 1.4s cubic-bezier(.3,.1,.2,1)"; });
  setTimeout(() => { beam.style.transform = "rotate(" + deg + "deg)"; pl.style.transform = pr.style.transform = "rotate(" + (-deg) + "deg)"; sfx.page(); }, 250);
}
async function playBubble(capId, b, hooks, isLast){
  const scene = $("#scene"); scene.innerHTML = sceneSVG(capId, b.ex || "neutral");
  const svg = scene.querySelector("svg"), btn = $("#tnext"), bub = $("#bubble");
  if(b.tag === "reveal" && hooks.commit){ hooks.commit(); hooks.commit = null; sfx.page(); renderStage(); }
  if(b.tag === "scale"){ showScale(G.bill); }
  if(b.map){ showMapBox(b.map); }
  btn.disabled = true; btn.textContent = isLast ? "Done" : "Continue";
  const mouth = setInterval(() => svg.classList.toggle("mo"), 135);
  const T = typer($("#btext"), b.text, 60);
  let ready = false, advance;
  const adv = new Promise(r => advance = r);
  bub.onclick = () => { if(!T.done) T.skip(); else if(ready) advance(); };
  btn.onclick = () => { if(ready) advance(); };
  await new Promise(r => T.onDone(r));
  clearInterval(mouth); svg.classList.remove("mo");
  ready = true; btn.disabled = false; btn.focus({preventScroll:true});
  await adv;
}
async function runTalk(capId, bubbles, hooks){
  hooks = hooks || {};
  G.busy = true; G.view = "talk"; closePicker(); talkShell(capId);
  for(let i = 0; i < bubbles.length; i++) await playBubble(capId, bubbles[i], hooks, i === bubbles.length - 1);
  if(hooks.commit){ hooks.commit(); renderStage(); }
  G.busy = false;
  if(hooks.after) await hooks.after();
}
async function startTalk(capId){
  if(G.busy || G.phase !== "play") return;
  ac(); const C = CAST[capId];
  if(!G.met[capId]){
    await runTalk(capId, C.intro.map(x => ({text:x[0], ex:x[1]})), {after:() => {
      G.met[capId] = true; G.lastTalk[capId] = {day:G.day, intro:true}; setView("bill"); renderBadges();
      toast("You have met " + C.name + ". Next time, ask what he thinks of the bill.");
    }});
    return;
  }
  if(G.actions <= 0) return toast("The House is done for today. Change the bill, or end the day.");
  G.visits[capId] = (G.visits[capId] || 0) + 1; G.actionsUsed++;
  const rng = mulberry32(G.seed * 97 + G.day * 13 + G.actionsUsed * 101 + capId.length * 7);
  let comp, hooks = {};
  const base = {cap:capId, bill:cloneBill(G.bill), mods:G.mods, members:G.members, visits:G.visits[capId], day:G.day, lastFail:G.lastFail, unlocked:G.unlocked, rng, favorsLeft:START_FAVORS - billCost(G.bill)};
  if(capId === "thomas") comp = composeSenate(base);
  else {
    const reads = readBloc(G.members, C.bloc, G.bill, G.mods, rng);
    comp = composeHouse(Object.assign(base, {reads}));
    hooks.commit = () => commitReads(C.bloc, reads);
  }
  hooks.after = async () => {
    G.actions--; G.lastFail = false;
    G.lastTalk[capId] = {day:G.day, est:comp.notes.est, ask:comp.notes.ask};
    comp.unlocks.forEach(k => { if(!G.unlocked.has(k)){ G.unlocked.add(k); G.fresh.add(k); const [a, id] = k.split(":"); toast("New idea on the table: " + optById(a, id).label); } });
    if(comp.friend) G.offers[capId] = {friend:comp.friend};
    setView("bill"); renderHUD(); renderBadges();
    if(G.actions <= 0) toast(G.day >= TOTAL_DAYS ? "That was your last talk. You can still change the bill. Then call the vote." : "That was your second talk. You can still change the bill. Then end the day.");
  };
  await runTalk(capId, comp.bubbles, hooks);
}

/* ---------------- days ---------------- */
async function endDay(){
  if(G.phase !== "play") return;
  if(G.day >= TOTAL_DAYS) return forcedVote();
  G.busy = true;
  const res = advanceDays(1);
  if(res.over) return forcedVote();
  const d = DAYS[G.day - 1];
  renderHUD();

function countUp(a, n, ms){
  return new Promise(res => {
    if(FAST) ms = 40;
    const A = $(".bignum .a"), N = $(".bignum .n"), t0 = performance.now();
    let lastTick = 0;
    (function f(now){
      const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 2.2);
      const x = Math.round(a * e), y = Math.round(n * e);
      A.textContent = x; N.textContent = y;
      if(x + y !== lastTick && (x + y) % 4 === 0){ sfx.tick(); } lastTick = x + y;
      if(k < 1) requestAnimationFrame(f); else { A.textContent = a; N.textContent = n; res(); }
    })(t0);
  });
}

async function doVote(forced){
  G.busy = true; G.phase = "vote"; G.view = "vote"; closePicker();
  const bill = cloneBill(G.bill);
  if(bill.pr === "postpone" || bill.pr === "committee"){ G.phase = "play"; return procedureDud(bill); }
  const rng = mulberry32(G.seed * 7919 + G.day * 31 + G.failed * 1009 + 5);
  const V = runVote(G.members, bill, G.mods, rng);
  const absent = {}; G.members.forEach(m => { if(!V.att[m.id]) absent[m.id] = true; });
  const n = V.results.length;
  $("#panel").innerHTML = `<div class="voteview"><h2 class="panelh">The clerk calls the roll</h2><div class="rcname" id="rcname"></div><div class="bignum"><span class="a">0</span> \u2013 <span class="n">0</span></div><div class="needline" id="needline"></div><div class="verdict" id="verdict"></div><button class="btn" id="vNext" disabled>Continue</button></div>`;

    renderStage({absent});

    await countUp(r.aye, r.nay, 2600);
    $("#verdict").textContent = r.pass ? "Passed." : "Failed.";
    $("#verdict").className = "verdict " + (r.pass ? "pass" : "fail");

    await waitButton("vNext");
  }

}
function senateWord(bill, ok){
  if(ok) return bill.me === "twin" ? ["Both bills are on the desk together. The Senate agrees. Twelve and twelve. Everyone can breathe.", "warm"] : ["The Senate agrees. I expected more shouting.", "amused"];
  if(!(bill.mo === "silent" || bill.mo === "open")) return ["The Senate will not accept the limit. It never would. We wasted a week.", "angry"];
  if(bill.me === "alone") return ["Maine without Missouri makes 12 free states to 11 slave. The Senate said no. That was always going to happen.", "skeptical"];
  if(bill.me === "pledge") return ["A promise of Missouri later is not Missouri. The Senate said no.", "skeptical"];

async function afterFailure(o){
  // The House said no: two days gone, everyone remembers.
  const bill = G.bill, res = o.result;
  G.failed++; G.lastFail = true;
  if(res){
    const main = res.V.results.find(r => !r.pass);
    if(main){
      BLOC_IDS.forEach(b => {
        const mem = G.members.filter(m => m.bloc === b && res.V.att[m.id]);
        const nay = mem.filter(m => !main.votes[m.id]).length;
        if(mem.length && nay / mem.length > 0.6) G.mods.hard[b] = Math.max(-0.75, (G.mods.hard[b] || 0) - 0.25);
      });
    }
    Object.values(G.reads).forEach(r => r.stale = true);
  } else Object.values(G.reads).forEach(r => { r.stale = true; });
  const adv = advanceDays(o.days);
  if(adv.over) return showEpilogue(false, res || {bill, V:{results:[]}, housePass:false, senate:null});

  renderHUD();
  overlay(`<h2>${d.dow}, ${d.date}</h2>${detail ? `<p><b>${detail}</b> ${recorded}</p>` : ""}<p>${o.days} days are gone. ${adv.notes.map(esc).join(" ")}</p><p>The members who voted no are now more set in their view.</p><div class="row"><button class="btn" id="mBack">Back to the table</button></div>`);

}

      <div class="dbox"><h2>Friends you made</h2><p>${friends.length ? esc(friends.join(", ")) + ". They will remember who wrote the bill." : "None who will say so."}</p></div>
    </section>
    <section class="dbox wide"><h2>What really happened, and your game</h2>
      <table class="dt dcmp"><thead><tr><th></th><th>In 1820</th><th>In your game</th></tr></thead><tbody>${compare}</tbody></table></section>
    <section class="dbox wide"><h2>Think about it</h2><ol class="dq">${DEBRIEF_Q.map(q => `<li><p>${esc(q[0])}</p><p class="hint">Sentence starter: ${esc(q[1])}</p><textarea rows="4" aria-label="${esc(q[0])}"></textarea></li>`).join("")}</ol></section>
    <footer class="dbtns"><button class="btn" id="dPrint">Print or save as PDF</button><button class="btn ghost" id="dWatch">Watch the ending again</button><button class="btn ghost" id="dAgain">Play again</button></footer>
  </div>`;
}
async function showDebrief(result, res){
  closeOverlay(); G.phase = "over"; G.busy = false;
  let d = $("#debrief"); if(d) d.remove();
  d = document.createElement("div"); d.id = "debrief"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Debrief");
  d.innerHTML = debriefHTML(result, res);
  document.body.appendChild(d); d.scrollTop = 0;
  $("#dPrint").addEventListener("click", () => window.print());
  $("#dAgain").addEventListener("click", () => { location.href = replayUrl(); });
  $("#dWatch").addEventListener("click", async () => { d.style.display = "none"; await playCinema("victory", cinemaData(result, res)); d.style.display = ""; });
  const h = $("h1", d); if(h){ h.setAttribute("tabindex", "-1"); h.focus({preventScroll:true}); }
}

</script>
</body>
</html>
